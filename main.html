<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
  </head>
  <body>
    <!--ホーム画面-->
    <div class="homeScreen">
      <header>
        <!--タイトルとクイズを作るボタン作成-->
        <div class="header-container">
          <h1 class="header-title">Quizメーカー</h1>
          <p class="quizmake-btn">クイズを作成</p>
        </div>
      </header>
      <main>
        <!--自分が作成したクイズを表示-->
        <div class="quiz-container">
          <h2 class="quiz">私が制作したクイズ</h2>
          <ul class="quiz-list">
            <li class="quiz-item">
              <p class="quiz-title">OverWatch</p>
              <img
                class="quiz-image"
                src="../img/test.png"
                alt="クイズの画像"
              />
            </li>
            <li class="quiz-item">
              <p class="quiz-title">OverWatch</p>
              <img
                class="quiz-image"
                src="../img/test.png"
                alt="クイズの画像"
              />
            </li>
            <li class="quiz-item">
              <p class="quiz-title">OverWatch</p>
              <img
                class="quiz-image"
                src="../img/test.png"
                alt="クイズの画像"
              />
            </li>
          </ul>
        </div>
        <!--他のユーザーが作成したクイズ表示-->
        <div class="quiz-container">
          <h2 class="quiz">他のユーザーが制作したクイズ</h2>
          <ul class="quiz-list">
            <li class="quiz-item">
              <p class="quiz-title">OverWatch</p>
              <img
                class="quiz-image"
                src="../img/test.png"
                alt="クイズの画像"
              />
            </li>
            <li class="quiz-item">
              <p class="quiz-title">OverWatch</p>
              <img
                class="quiz-image"
                src="../img/test.png"
                alt="クイズの画像"
              />
            </li>
            <li class="quiz-item">
              <p class="quiz-title">OverWatch</p>
              <img
                class="quiz-image"
                src="../img/test.png"
                alt="クイズの画像"
              />
            </li>
          </ul>
        </div>
        <div class="quizMakeScreen"></div>
        <script src="./src/main.js" type="module"></script>
      </main>
    </div>

    <!--クイズ作成画面-->
    <div class="quizMakeScreen">
      <header>
        <h1 class="quizMakeTitle">クイズ作成</h1>
      </header>
      <body></body>
    </div>
    <footer></footer>
  </body>
</html>
